<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Offline</title>
  <style>
    :root {
      --paper: #F6F7F9;
      --surface: #FFFFFF;
      --ink: #14161B;
      --muted: #5A6072;
      --line: #E2E5EB;
      --crimson: #B3123C;
      --crimson-hover: #960F32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0F1117;
        --surface: #161922;
        --ink: #F0F2F6;
        --muted: #8B93A7;
        --line: #262B38;
        --crimson: #E0315A;
        --crimson-hover: #EC4970;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }
    .card {
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    button {
      background-color: var(--crimson);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      height: 44px;
      min-height: 44px;
      padding: 0 24px;
      cursor: pointer;
      width: 100%;
      transition: background-color 150ms ease;
    }
    button:hover {
      background-color: var(--crimson-hover);
    }
    button:focus-visible {
      outline: 2px solid var(--crimson);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
